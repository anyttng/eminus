plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
    id 'idea'
}

evaluationDependsOn(':common')

ext {
    mod_id = 'eminus'
    mod_name = 'Eminus'
    mod_version = eminus_version
}

version = mod_version
group = mod_group_id

def withBuildSuffix = { baseVersion ->
    def buildSuffix = findProperty("${mod_id}_build")
    buildSuffix ? "${baseVersion}-${buildSuffix}" : baseVersion
}
def modIngameVersion = withBuildSuffix(mod_version)
def jarVersion = withBuildSuffix("${mod_version}+mc${minecraft_version}")

base {
    archivesName = mod_id
}

// The final mod jar: this module's loader glue plus everything from common — classes, mixin configs and assets.
tasks.named('jar', Jar) {
    archiveFileName = "${mod_id}-neoforge-${jarVersion}.jar"
    from(project(':common').sourceSets.main.output)
}

// 'common' is also this mod's API artifact — a loader build reads its classes directly and would never produce the
// jar consumers compile against.
tasks.named('assemble') {
    dependsOn ':common:jar'
}

// Mojang ships Java 25 to end users, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    // A client-only mod: the one run configuration is the client.
    runs {
        client {
            client()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(project(':common').sourceSets.main)
        }
    }

    // The test source set with the Minecraft classes on its classpath, run through the FML JUnit launcher, so
    // registries are bootstrapped and the mod's mixins are applied. Only tests that need a loader live here.
    unitTest {
        enable()
        testedMod = mods.eminus
    }
}

dependencies {
    implementation project(':common')

    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// The loader-bound tests are shared with the fabric module: written once next to the code they cover, run under
// each loader's own JUnit launcher.
sourceSets.test.java.srcDir '../common/src/loaderTest/java'

test {
    useJUnitPlatform()
    filter {
        // A --tests pattern that names nothing in this module is a zero-test run, not a failed one.
        failOnNoMatchingTests = false
    }
    // The test JVM's working directory is FML's own, so a test that writes a report is told where the module's go.
    systemProperty 'eminus.reports', layout.buildDirectory.dir('reports').get().asFile.absolutePath
    // What this jar ships is tested in common; the loader suite alone would let a red common through.
    dependsOn(':common:test')
}

// Expands the declared properties in the mod metadata template. A missing property is an error.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : modIngameVersion,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
