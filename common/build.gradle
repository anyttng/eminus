plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
    id 'idea'
}

version = eminus_version
group = mod_group_id

// 1.21.1 runs on Java 21 — that is what NeoForge 21.1.x and its Fabric contemporaries are built against.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// NeoForm mode: plain vanilla (Mojmap) on the classpath, no loader — the compile-time proof that this module is
// loader-free.
neoForge {
    neoFormVersion = project.neoform_version
}

// NeoForm brings only vanilla; the mixin annotations the sources carry come from the same artifacts the NeoForge
// runtime ships (pinned in gradle.properties from the neo_version userdev config). compileOnly — applying them is
// the loaders' business.
dependencies {
    compileOnly "net.fabricmc:sponge-mixin:${mixin_version}"
    compileOnly "io.github.llamalad7:mixinextras-common:${mixinextras_version}"
    compileOnly "org.jspecify:jspecify:${jspecify_version}"
    testCompileOnly "org.jspecify:jspecify:${jspecify_version}"
}

// Sodium's config API for the page in its options screen. On 1.21.1 the Fabric artifact is in intermediary, so the
// NeoForge one is taken — Mojmap, as this module compiles — and its classes ride an inner jar, unpacked here.
// compileOnly — Sodium asks for the class itself.
repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

configurations {
    sodiumModJar
}

dependencies {
    sodiumModJar "maven.modrinth:sodium:${sodium_version}"
}

var sodiumModJars = tasks.register('unpackSodiumMod', Sync) {
    from(zipTree(configurations.sodiumModJar.singleFile)) {
        include 'META-INF/jarjar/net.caffeinemc.sodium-neoforge-*-mod.jar'
        eachFile { it.relativePath = new RelativePath(true, it.name) }
    }
    includeEmptyDirs = false
    into layout.buildDirectory.dir('sodium-mod')
}

dependencies {
    compileOnly files(sodiumModJars).asFileTree.matching { include '*.jar' }
}

// The cell store's fixed stack. This module compiles and tests against them; the loader modules bundle them.
dependencies {
    implementation "org.xerial:sqlite-jdbc:${sqlite_jdbc_version}"
    implementation "io.airlift:aircompressor:${aircompressor_version}"
}

// Plain JUnit on the NeoForm vanilla classpath: NeoForm mode has no FML, hence no junit run-type and no applied
// mixins — a test that needs a mixin at runtime belongs to a loader module.
neoForge.addModdingDependenciesTo(sourceSets.test)

dependencies {
    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    filter {
        // A --tests pattern that names nothing in this module is a zero-test run, not a failed one.
        failOnNoMatchingTests = false
    }
    // The vanilla log4j config writes logs/latest.log into the working directory — kept under build/, as FML does.
    workingDir = layout.buildDirectory.dir('test-run').get().asFile
    doFirst { workingDir.mkdirs() }
    // The working directory is not the module, so a test that writes a report is told where the module's reports go.
    systemProperty 'eminus.reports', layout.buildDirectory.dir('reports').get().asFile.absolutePath
    // ApiSurfaceTest lists the api sources, which are not on the classpath, so it is given the repo root.
    systemProperty 'eminus.repoRoot', rootDir.absolutePath
}

// The artifact the harness compiles against: com/eminus/api alone, so its compile classpath cannot reach an internal
// type at all. That the API's own signatures name no internal is ApiSurfaceTest's guarantee.
tasks.register('apiJar', Jar) {
    archiveBaseName = 'eminus-api'
    from sourceSets.main.output
    include 'com/eminus/api/**'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
