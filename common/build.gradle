plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev'
    id 'idea'
}

version = eminus_version
group = mod_group_id

// Mojang ships Java 25 to end users, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// NeoForm mode: plain vanilla (Mojmap) on the classpath, no loader — the compile-time proof that this module is
// loader-free.
neoForge {
    neoFormVersion = project.neoform_version
}

// NeoForm brings only vanilla; the mixin annotations the sources carry come from the same artifacts the NeoForge
// runtime ships (pinned in gradle.properties from the neo_version userdev config). compileOnly — applying them is
// the loaders' business.
dependencies {
    compileOnly "net.fabricmc:sponge-mixin:${mixin_version}"
    compileOnly "io.github.llamalad7:mixinextras-common:${mixinextras_version}"
}

// Sodium's config API for the page in its options screen. The Fabric artifact is taken because the NeoForge one
// nests its classes in an inner jar; the API types name vanilla alone. compileOnly — Sodium asks for the class itself.
repositories {
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    // MixinSquared: the compat gate's checker fixtures carry its @TargetHandler.
    maven {
        name = 'Bawnorton'
        url = 'https://maven.bawnorton.com/releases'
        content {
            includeGroup 'com.github.bawnorton.mixinsquared'
        }
    }
}

dependencies {
    compileOnly("maven.modrinth:sodium:${sodium_version}") {
        transitive = false
    }
    compileOnly("maven.modrinth:iris:${iris_version}") {
        transitive = false
    }
    compileOnly("maven.modrinth:vitrail-shaders:${vitrail_version}") {
        transitive = false
    }
}

// The cell store's fixed stack. This module compiles and tests against them; the loader modules bundle them.
dependencies {
    implementation "org.xerial:sqlite-jdbc:${sqlite_jdbc_version}"
    implementation "io.airlift:aircompressor:${aircompressor_version}"
}

// Plain JUnit on the NeoForm vanilla classpath: NeoForm mode has no FML, hence no junit run-type and no applied
// mixins — a test that needs a mixin at runtime belongs to a loader module.
neoForge.addModdingDependenciesTo(sourceSets.test)

dependencies {
    // A compat config plugin cannot even load without IMixinConfigPlugin.
    testRuntimeOnly "net.fabricmc:sponge-mixin:${mixin_version}"
    // The checker's fixture mixins carry the real annotations.
    testCompileOnly "net.fabricmc:sponge-mixin:${mixin_version}"
    testCompileOnly "io.github.llamalad7:mixinextras-common:${mixinextras_version}"
    testCompileOnly "com.github.bawnorton.mixinsquared:mixinsquared-common:${mixinsquared_version}"
    // CompatGatesTest checks every gate against the Sodium, Iris and Vitrail builds this module compiles against.
    testRuntimeOnly("maven.modrinth:sodium:${sodium_version}") {
        transitive = false
    }
    testRuntimeOnly("maven.modrinth:iris:${iris_version}") {
        transitive = false
    }
    testRuntimeOnly("maven.modrinth:vitrail-shaders:${vitrail_version}") {
        transitive = false
    }
    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    filter {
        // A --tests pattern that names nothing in this module is a zero-test run, not a failed one.
        failOnNoMatchingTests = false
    }
    // The vanilla log4j config writes logs/latest.log into the working directory — kept under build/, as FML does.
    workingDir = layout.buildDirectory.dir('test-run').get().asFile
    doFirst { workingDir.mkdirs() }
    // The working directory is not the module, so a test that writes a report is told where the module's reports go.
    systemProperty 'eminus.reports', layout.buildDirectory.dir('reports').get().asFile.absolutePath
    // ApiSurfaceTest lists the api sources and CompatGatesTest the compat configs, read from the sources rather than
    // the classpath, so both are given the repo root.
    systemProperty 'eminus.repoRoot', rootDir.absolutePath
}

// The artifact another mod and the harness compile against: com/eminus/api alone, so their compile classpath cannot
// reach an internal type at all. That the API's own signatures name no internal is ApiSurfaceTest's guarantee.
def apiPackage = 'com/eminus/api/**'
def apiArtifactId = 'eminus-api'

var apiJar = tasks.register('apiJar', Jar) {
    archiveBaseName = apiArtifactId
    from sourceSets.main.output
    include apiPackage
}

var apiSourcesJar = tasks.register('apiSourcesJar', Jar) {
    archiveBaseName = apiArtifactId
    archiveClassifier = 'sources'
    from sourceSets.main.allJava
    include apiPackage
}

var apiJavadoc = tasks.register('apiJavadoc', Javadoc) {
    source = sourceSets.main.allJava.matching { include apiPackage }
    classpath = sourceSets.main.compileClasspath + sourceSets.main.output
    destinationDir = layout.buildDirectory.dir('docs/api-javadoc').get().asFile
    options {
        encoding = 'UTF-8'
        charSet = 'UTF-8'
        addStringOption('Xdoclint:all,-missing', '-quiet')
    }
}

var apiJavadocJar = tasks.register('apiJavadocJar', Jar) {
    archiveBaseName = apiArtifactId
    archiveClassifier = 'javadoc'
    from apiJavadoc
}

publishing {
    publications {
        register('api', MavenPublication) {
            groupId = mod_group_id
            artifactId = apiArtifactId
            version = eminus_version
            artifact apiJar
            artifact apiSourcesJar
            artifact apiJavadocJar
            pom {
                name = 'Eminus API'
                description = 'The semver-stable surface of Eminus for other mods.'
                url = 'https://github.com/anyttng/eminus'
                licenses {
                    license {
                        name = mod_license
                    }
                }
            }
        }
    }
    repositories {
        // -PeminusMavenDir points the tree at a checkout of the repository's 'maven' branch, which is what publishes it.
        maven {
            name = 'eminus'
            url = uri(findProperty('eminusMavenDir') ?: layout.buildDirectory.dir('maven').get().asFile)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
