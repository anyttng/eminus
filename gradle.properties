# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment Properties
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=26.3
# The Minecraft version range can use any release version of Minecraft as bounds.
minecraft_version_range=[26.3]
# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=26.3.0.3-beta
# NeoForm (vanilla Mojmap) pin for the loader-free 'common' module; read from the neoforge userdev config of neo_version.
neoform_version=26.3-1
# Mixin + MixinExtras for common's compileOnly classpath — the same versions the neo_version userdev config ships.
mixin_version=0.17.3+mixin.0.8.7
mixinextras_version=0.5.4

# Fabric side: Loom (build plugin), Loader, and the Fabric API build for this game version — pinned from maven.fabricmc.net.
# The 26.x no-mappings mode lives in the 1.17 snapshots — the line Fabric names for 26.3.
fabric_loom_version=1.17-SNAPSHOT
fabric_loader_version=0.19.5
fabric_api_version=0.160.6+26.3
# Aligned with the junit-bom that FML's junit launcher (junit-fml) imports.
junit_version=5.13.4
# ModMenu supplies the Fabric side's config-screen entrypoint; compileOnly, so the jar loads without it.
modmenu_version=21.0.0-beta.1
# The cell store's fixed stack: SQLite through sqlite-jdbc, zstd in pure Java through aircompressor. Both are
# bundled into each loader's jar.
sqlite_jdbc_version=3.53.4.0
aircompressor_version=2.0.3
# Sodium's config API, for the page in Sodium's options screen; compileOnly, from Modrinth's Maven.
sodium_version=mc26.3-0.9.2-fabric

## Mod Properties

# The license of the mod.
mod_license=MIT
# The group ID for the mod. Matches the base package of the sources.
mod_group_id=com.eminus
# The mod version. See https://semver.org/
eminus_version=0.2.0
eminus_build=dev.32
