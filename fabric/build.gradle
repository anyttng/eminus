plugins {
    id 'net.fabricmc.fabric-loom-remap'
    id 'idea'
}

ext {
    mod_id = 'eminus'
}

version = eminus_version
group = mod_group_id

def withBuildSuffix = { baseVersion ->
    def buildSuffix = findProperty("${mod_id}_build")
    buildSuffix ? "${baseVersion}-${buildSuffix}" : baseVersion
}
def modIngameVersion = withBuildSuffix(eminus_version)
def jarVersion = withBuildSuffix("${eminus_version}+mc${minecraft_version}")

base {
    archivesName = mod_id
}

// 1.21.1 runs on Java 21 — that is what NeoForge 21.1.x and its Fabric contemporaries are built against.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Common is compiled once, in its own module, and this one takes that output: the classes the Fabric suite runs are
// then the very classes the shipped jar carries. Both modules compile against Mojmap, and remapJar carries the whole
// jar — common's classes and their mixin annotations included — onto intermediary, so nothing in common's output has
// to pass through Loom's compile.
evaluationDependsOn(':common')
def commonMain = project(':common').sourceSets.main

repositories {
    // ModMenu, for the config-screen entrypoint.
    maven {
        name = 'Terraformers'
        url = 'https://maven.terraformersmc.com/releases'
        content {
            includeGroup 'com.terraformersmc'
        }
    }
    // Sodium, for the 'sodium:config_api_user' entrypoint.
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

// Same unpack as in common, for the same reason: common's classes are remapped against this module's classpath, and
// the 'sodium:config_api_user' entrypoint names Sodium's config API.
configurations {
    sodiumModJar
}

dependencies {
    sodiumModJar "maven.modrinth:sodium:${sodium_version}"
}

var sodiumModJars = tasks.register('unpackSodiumMod', Sync) {
    from(zipTree(configurations.sodiumModJar.singleFile)) {
        include 'META-INF/jarjar/net.caffeinemc.sodium-neoforge-*-mod.jar'
        eachFile { it.relativePath = new RelativePath(true, it.name) }
    }
    includeEmptyDirs = false
    into layout.buildDirectory.dir('sodium-mod')
}

dependencies {
    implementation commonMain.output
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // Mojmap on both sides: the mixins are written against the same names NeoForge uses, so common's classes serve
    // either loader, and remapJar carries this module's copy onto intermediary.
    mappings loom.officialMojangMappings()
    // modImplementation, not implementation: only the mod configurations run through Loom's dependency provider, which
    // remaps these jars off intermediary and applies the loader's fabric-installer.json (mixin, asm).
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // The 'modmenu' entrypoint class is only ever asked for by ModMenu itself, so it never loads without it.
    // modCompileOnly: its screen-factory API names the game's Screen, which only the remapped jar spells in Mojmap.
    modCompileOnly "com.terraformersmc:modmenu:${modmenu_version}"

    // The 'sodium:config_api_user' entrypoint class is likewise only ever asked for by Sodium.
    compileOnly files(sodiumModJars).asFileTree.matching { include '*.jar' }

    // Not bundled: Fabric Loader carries MixinExtras itself and keeps the higher version, so a copy here is dropped
    // at load and only weighs. No annotation processor and no refmap: Loom 1.17 defaults useLegacyMixinAp to false
    // and remaps the mixin annotations inside remapJar instead.
    compileOnly "io.github.llamalad7:mixinextras-fabric:${mixinextras_version}"

    // The cell store's fixed stack; Loom wraps a plain library jar as a nested mod itself. The root lifts the wrapped
    // copies out of this jar into the shipped shell, the one copy both loaders open.
    include(implementation("org.xerial:sqlite-jdbc:${sqlite_jdbc_version}"))
    include(implementation("io.airlift:aircompressor:${aircompressor_version}"))
}

// Two jars on this game version, and only the second one ships: Loom compiles into a dev jar and remaps that into
// build/libs, so the dev jar is named apart and a deploy matching on the name never picks it up.
tasks.named('jar', Jar) {
    archiveFileName = "${mod_id}-fabric-${jarVersion}-dev.jar"
    from(commonMain.output)
}

tasks.named('remapJar', AbstractArchiveTask) {
    archiveFileName = "${mod_id}-fabric-${jarVersion}.jar"
}

tasks.named('assemble') {
    dependsOn ':common:jar', ':common:apiJar'
}

// The loader-bound tests shared with the neoforge module, run here under Fabric Loader's JUnit launcher so the
// mixins this jar ships are exercised by the loader that applies them.
sourceSets.test.java.srcDir '../common/src/loaderTest/java'

dependencies {
    testImplementation "net.fabricmc:fabric-loader-junit:${fabric_loader_version}"
    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    filter {
        // A --tests pattern that names nothing in this module is a zero-test run, not a failed one.
        failOnNoMatchingTests = false
    }
    systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
    // The test JVM's working directory is kept under build/, so a test that writes a report is told where the module's go.
    systemProperty 'eminus.reports', layout.buildDirectory.dir('reports').get().asFile.absolutePath
    // The vanilla log4j config writes logs/latest.log into the working directory — kept under build/, as FML does.
    workingDir = layout.buildDirectory.dir('test-run').get().asFile
    doFirst { workingDir.mkdirs() }
    // What this jar ships is tested in common; the loader suite alone would let a red common through.
    dependsOn(':common:test')
}

processResources {
    inputs.property 'version', modIngameVersion
    filesMatching('fabric.mod.json') {
        expand version: modIngameVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
